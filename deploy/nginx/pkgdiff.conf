# Host nginx config — /etc/nginx/sites-available/pkgdiff
# Certificates already exist on the host: /etc/letsencrypt/live/pkgdiff.dev/
# Apply changes: copy this file over the one on the host, then `nginx -t && systemctl reload nginx`.
# Behind Cloudflare, cloudflare-realip.conf (same folder) must be installed as well: without it
# $remote_addr below is a Cloudflare address and every visitor shares one rate-limit bucket.
#
# Every HTTPS name only answers Cloudflare (Authenticated Origin Pulls): a direct request to the
# server address would skip Cloudflare Access, which guards /admin, /api/admin, /api/auth and
# /hangfire. Turn on SSL/TLS > Origin Server > Authenticated Origin Pulls > Global in Cloudflare
# BEFORE reloading this file, and install Cloudflare's client CA once:
#   curl -fsSo /etc/nginx/cloudflare-origin-pull-ca.pem \
#     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
# Turning that switch off while these lines are live answers every visitor with 400.
#
# "http2 on;" needs nginx 1.25.1 or newer. On an older nginx the runbook installs this file with
# the older spelling ("listen 443 ssl http2;"), which is the only one that version knows.
#
# Headers: this layer terminates TLS, so it sends Strict-Transport-Security, on every answer of
# every name. The other security headers of pkgdiff.dev come from the container nginx behind it,
# which knows the application; api.pkgdiff.dev goes straight to the backend and gets them here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name pkgdiff.dev www.pkgdiff.dev api.pkgdiff.dev;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# www → non-www
server {
    listen 443 ssl;
    http2 on;
    server_name www.pkgdiff.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pkgdiff.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkgdiff.dev/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://pkgdiff.dev$request_uri;
}

# Frontend (container nginx: 8090 → files, rendered pages, /api, /analysisHub, /hangfire)
server {
    listen 443 ssl;
    http2 on;
    server_name pkgdiff.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pkgdiff.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkgdiff.dev/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # The largest request is a blog post saved from the admin panel
    client_max_body_size 2m;

    # The backend sends this header too once it sees an HTTPS request; one copy is enough
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite: never forward a client-supplied X-Forwarded-For chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# API subdomain — straight to the backend container
server {
    listen 443 ssl;
    http2 on;
    server_name api.pkgdiff.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pkgdiff.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkgdiff.dev/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2m;

    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # This name answers API calls with JSON and files; nothing it sends is a page that may load
    # anything. The Hangfire dashboard is used through pkgdiff.dev/hangfire, not through this name.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite: never forward a client-supplied X-Forwarded-For chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
