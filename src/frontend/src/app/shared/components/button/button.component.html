<button [type]="type()" [class]="classes" [disabled]="disabled() || loading()" (click)="handleClick($event)">
    @if (loading()) {
    <lucide-icon [img]="LoaderIcon" [class]="size() === 'sm' ? 'w-3 h-3' : size() === 'lg' ? 'w-5 h-5' : 'w-4 h-4'"
        class="animate-spin"></lucide-icon>
    }
    <ng-content></ng-content>
</button>
