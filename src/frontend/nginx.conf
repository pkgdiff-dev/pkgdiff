map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Plain HTTP: TLS and domain redirects are handled by the host nginx.
server {
    listen 80;
    server_name _;

    root /app/browser;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;

    # Trust X-Forwarded-For only from the compose subnet; it is overwritten, never appended, below.
    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Resolve per request so nginx starts and serves even while the render server is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri @ssr;
    }

    # X-Forwarded-Host/-Proto are left out on purpose: the render server needs only the client IP.
    location @ssr {
        set $ssr_upstream http://ssr:4000;
        proxy_pass $ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;

        # Without the render server, fall back to the client-side shell
        error_page 502 503 504 = /index.csr.html;

        # no-cache: a page references the hashed files of one build
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.csr.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/sitemap;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ^~ beats the asset regexes; no URI on proxy_pass keeps an encoded %2F from being decoded.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    location ^~ /analysisHub {
        proxy_pass http://backend:8080/analysisHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ^~ keeps the dashboard's .js/.css requests away from the asset regexes below.
    location ^~ /hangfire {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Hashed build files never go stale; a missing path that only looks like a file is a page.
    location ~ "^/[^/]+-[A-Z0-9]{8}\.(?:js|css)$" {
        try_files $uri @ssr;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        try_files $uri @ssr;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }
}
