<div class="py-20 flex flex-col items-center justify-center text-center max-w-md mx-auto">
  <div class="w-12 h-12 rounded-full bg-gray-50 dark:bg-gray-900 flex items-center justify-center mb-6">
    <lucide-icon [img]="InfoIcon" [size]="24" class="text-gray-400"></lucide-icon>
  </div>
  <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">No release notes available for this version.</h2>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-8 leading-relaxed">
    We are attempting to fetch data from the GitHub repository as a fallback. Registry-provided metadata is currently missing for this specific version.
  </p>
  <a href="#"
    class="inline-flex items-center gap-2 text-sm font-medium text-primary hover:text-blue-700 transition-colors">
    View on GitHub
    <lucide-icon [img]="ExternalLinkIcon" [size]="14"></lucide-icon>
  </a>
</div>
