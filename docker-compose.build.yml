# Builds backend and frontend from source; use with PKGDIFF_IMAGE_TAG=local in .env:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    # Local builds mount no server settings file
    volumes: !reset []

  # The ssr service runs this same image
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
