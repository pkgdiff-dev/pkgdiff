<app-modal [title]="'Share ' + packageId()" size="sm" [sheetOnMobile]="true" (closed)="closed.emit()">
  <p class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 dark:text-gray-500 mb-2">Link</p>
  <div class="flex items-stretch gap-2">
    <div
      class="flex-1 min-w-0 flex items-center px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-sm font-mono text-gray-700 dark:text-gray-300">
      <span class="truncate" [title]="shareUrl()">{{ shareUrl() }}</span>
    </div>
    <button type="button" (click)="copyLink()"
      class="inline-flex items-center justify-center gap-1.5 px-4 rounded-lg text-sm font-semibold transition-colors flex-shrink-0"
      [class]="isCopied() ? 'bg-green-600 text-white' : 'bg-primary text-white hover:bg-primary/90'">
      <lucide-icon [img]="isCopied() ? CheckIcon : LinkIcon" [size]="16" aria-hidden="true"></lucide-icon>
      {{ isCopied() ? 'Copied' : 'Copy' }}
    </button>
  </div>

  <p class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 dark:text-gray-500 mt-6 mb-2">Share on</p>
  <div class="grid grid-cols-3 gap-2">
    <button type="button" (click)="shareToTwitter()"
      class="flex flex-col items-center gap-2 p-3 rounded-xl border border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-50 dark:bg-blue-900/20 text-[#1DA1F2]">
        <lucide-icon [img]="TwitterIcon" [size]="18" aria-hidden="true"></lucide-icon>
      </span>
      <span class="text-xs font-semibold text-gray-800 dark:text-gray-200">X / Twitter</span>
    </button>
    <button type="button" (click)="shareToLinkedIn()"
      class="flex flex-col items-center gap-2 p-3 rounded-xl border border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 dark:bg-blue-900/30 text-[#0A66C2]">
        <lucide-icon [img]="LinkedinIcon" [size]="18" aria-hidden="true"></lucide-icon>
      </span>
      <span class="text-xs font-semibold text-gray-800 dark:text-gray-200">LinkedIn</span>
    </button>
    <button type="button" (click)="shareToFacebook()"
      class="flex flex-col items-center gap-2 p-3 rounded-xl border border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-50 dark:bg-indigo-900/20 text-[#1877F2]">
        <lucide-icon [img]="FacebookIcon" [size]="18" aria-hidden="true"></lucide-icon>
      </span>
      <span class="text-xs font-semibold text-gray-800 dark:text-gray-200">Facebook</span>
    </button>
  </div>

  @if (canShareNatively) {
  <button type="button" (click)="shareNatively()"
    class="mt-3 w-full inline-flex items-center justify-center gap-2 py-3 rounded-xl border border-gray-200 dark:border-gray-800 text-sm font-semibold text-gray-800 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
    <lucide-icon [img]="ShareIcon" [size]="16" aria-hidden="true"></lucide-icon>
    More options
  </button>
  }
</app-modal>
