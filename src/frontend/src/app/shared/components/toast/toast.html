<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 max-w-sm w-full px-4">
  @for (toast of toasts(); track toast.id) {
    <div 
      class="flex items-start gap-3 px-4 py-3 rounded-lg border shadow-lg animate-slide-in"
      [class]="getStyles(toast.type)">
      <lucide-icon 
        [img]="getIcon(toast.type)" 
        [size]="20" 
        class="flex-shrink-0 mt-0.5">
      </lucide-icon>
      <p class="text-sm font-medium flex-1">{{ toast.message }}</p>
      <button 
        (click)="dismiss(toast.id)"
        class="flex-shrink-0 opacity-70 hover:opacity-100 transition-opacity">
        <lucide-icon [img]="XIcon" [size]="16"></lucide-icon>
      </button>
    </div>
  }
</div>
