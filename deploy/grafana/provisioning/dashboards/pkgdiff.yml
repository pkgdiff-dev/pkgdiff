# Dashboards from deploy/grafana/dashboards, read-only in Grafana: a change belongs in the repository
apiVersion: 1

providers:
  - name: pkgdiff
    folder: pkgdiff
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
