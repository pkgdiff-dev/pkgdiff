# The 7-day cooldown lets a broken or hijacked release be caught upstream first.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/backend"
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["QuestPDF"]
        update-types: [minor, patch]
      # Alone: a QuestPDF bump must pass .github/scripts/questpdf-cpu-check.sh before merging
      questpdf:
        patterns: ["QuestPDF"]
    ignore:
      # These majors arrive with the next .NET line, as one migration
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      # Must stay on the major of System.IdentityModel.Tokens.Jwt and JwtBearer
      - dependency-name: "Microsoft.IdentityModel.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/src/frontend"
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      angular:
        patterns: ["@angular/*"]
        update-types: [minor, patch]
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@angular/*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      # Follows the .NET line of the SignalR hub
      - dependency-name: "@microsoft/signalr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      # @angular/build 21 accepts typescript >=5.9 <6.0
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "jsdom"
        versions: [">=28.0.0"]
      - dependency-name: "lucide-angular"
        versions: [">=1.0.0"]
      # Types of the Node 22 LTS line the images run
      - dependency-name: "@types/node"
        versions: [">=23"]

  # One entry so the SDK/runtime references shared across Dockerfiles move in one PR
  - package-ecosystem: "docker"
    directories:
      - "/src/backend"
      - "/src/frontend"
      - "/.github/scripts/questpdf-cpu-check"
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Dependabot names Docker images without the registry (dotnet/sdk, not mcr.microsoft.com/...)
      dotnet-images:
        patterns: ["dotnet/*"]
      other-images:
        patterns: ["*"]
        exclude-patterns: ["dotnet/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Node 22 LTS line
      - dependency-name: "node"
        versions: [">=23"]
      # nginx stable is the even minor; odd minors are the mainline line
      - dependency-name: "nginx"
        versions: [">=1.31.0, <1.32.0", ">=1.33.0, <1.34.0", ">=1.35.0, <1.36.0"]
      # Ubuntu LTS only (QEMU stage of the harness)
      - dependency-name: "ubuntu"
        versions: [">=26.05"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # postgres majors need pg_upgrade; redis 8, grafana 14 and prometheus 4 are migrations
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
