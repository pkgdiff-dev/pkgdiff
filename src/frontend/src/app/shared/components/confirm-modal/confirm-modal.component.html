@if (service.config(); as config) {
<div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm animate-fade-in" aria-hidden="true" (click)="cancel()"></div>

  <div role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title"
    aria-describedby="confirm-modal-message" cdkTrapFocus cdkTrapFocusAutoCapture
    class="relative bg-white dark:bg-[#1a1a1a] rounded-xl shadow-xl max-w-md w-full overflow-hidden animate-scale-in border border-gray-200 dark:border-gray-800">
    <div class="p-6">
      <div class="flex items-start gap-4">
        <div class="flex-shrink-0" aria-hidden="true">
          @if (config.type === 'danger') {
          <div class="p-2 bg-red-100 dark:bg-red-900/30 rounded-full text-red-600 dark:text-red-400">
            <lucide-icon [img]="AlertIcon" [size]="24"></lucide-icon>
          </div>
          } @else if (config.type === 'warning') {
          <div class="p-2 bg-yellow-100 dark:bg-yellow-900/30 rounded-full text-yellow-600 dark:text-yellow-400">
            <lucide-icon [img]="AlertCircleIcon" [size]="24"></lucide-icon>
          </div>
          } @else {
          <div class="p-2 bg-blue-100 dark:bg-blue-900/30 rounded-full text-blue-600 dark:text-blue-400">
            <lucide-icon [img]="InfoIcon" [size]="24"></lucide-icon>
          </div>
          }
        </div>
        <div class="flex-1">
          <h2 id="confirm-modal-title" class="text-lg font-semibold text-gray-900 dark:text-white mb-2">
            {{ config.title }}
          </h2>
          <p id="confirm-modal-message" class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed">
            {{ config.message }}
          </p>
        </div>
      </div>
    </div>

    <div class="px-6 py-4 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
      <!-- The first focusable element gets the focus: for a destructive question that is "Cancel" -->
      <button type="button" (click)="cancel()"
        class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200 dark:focus:ring-gray-700 transition-colors">
        {{ config.cancelText || 'Cancel' }}
      </button>
      <button type="button" (click)="confirm()"
        [class]="config.type === 'danger' ? 'bg-red-600 hover:bg-red-700 focus:ring-red-500' : 'bg-primary hover:bg-primary/90 focus:ring-primary'"
        class="px-4 py-2 text-sm font-medium text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 transition-colors">
        {{ config.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
}
