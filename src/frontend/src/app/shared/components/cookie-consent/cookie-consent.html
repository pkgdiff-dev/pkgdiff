@if (visible()) {
  <div 
    class="fixed bottom-0 left-0 right-0 z-50 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 shadow-2xl animate-slide-up"
  >
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-2.5 md:py-4">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-2 md:gap-4">
        <div class="flex-1">
          <p class="text-xs md:text-sm text-gray-700 dark:text-gray-300">
            We use local storage to enhance your experience. No third-party cookies or tracking.
            <a 
              routerLink="/cookies" 
              class="text-primary hover:underline ml-1 font-medium"
            >
              Learn more
            </a>
          </p>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto">
          <button
            (click)="decline()"
            type="button"
            class="flex-1 md:flex-none px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg transition-colors"
          >
            Decline
          </button>
          <button
            (click)="accept()"
            type="button"
            class="flex-1 md:flex-none px-4 py-2 text-sm font-medium text-white bg-primary hover:bg-primary/90 rounded-lg transition-colors"
          >
            Accept
          </button>
        </div>
      </div>
    </div>
  </div>
}

<style>
@keyframes slide-up {
  from {
    transform: translateY(100%);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.animate-slide-up {
  animation: slide-up 0.4s ease-out;
}
</style>
