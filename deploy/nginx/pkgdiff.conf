# Host nginx (/etc/nginx/sites-available/pkgdiff); needs cloudflare-realip.conf installed too.
# HTTPS only answers Cloudflare (Authenticated Origin Pulls) so Cloudflare Access can't be bypassed.
# "http2 on;" needs nginx 1.25.1 or newer.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name pkgdiff.dev www.pkgdiff.dev api.pkgdiff.dev;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.pkgdiff.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pkgdiff.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkgdiff.dev/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://pkgdiff.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pkgdiff.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pkgdiff.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkgdiff.dev/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    # The backend sends HSTS too; keep only one copy
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite: never forward a client-supplied X-Forwarded-For chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.pkgdiff.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pkgdiff.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkgdiff.dev/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2m;

    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite: never forward a client-supplied X-Forwarded-For chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
