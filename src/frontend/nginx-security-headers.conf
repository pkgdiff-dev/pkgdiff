# Sent with every response of this server: files, rendered pages and proxied API answers.
# nginx does not inherit add_header into a block that has an add_header of its own, so every such
# location includes this file again. HSTS is not here: it belongs to the layer that terminates TLS
# (the host nginx).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
# No 'unsafe-eval': nothing in the application or the Hangfire dashboard evaluates strings.
# 'unsafe-inline' stays for scripts: the theme script in index.html, Angular's event replay and its
# stylesheet loader are inline. Cloudflare Web Analytics injects its beacon from static.cloudflareinsights.com
# and reports to cloudflareinsights.com. connect-src lists the API (same origin, the hub included)
# and that beacon; nothing else is called from a browser.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
