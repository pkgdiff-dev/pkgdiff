<app-modal title="Export" size="md" [sheetOnMobile]="true" [closable]="!exporting()" (closed)="closed.emit()">
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">{{ subject() }}</p>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
    @for (option of formats; track option.format) {
    <button type="button" (click)="export(option.format)" [disabled]="exporting() !== null"
      class="group flex items-center gap-3 w-full p-3 rounded-xl border border-gray-200 dark:border-gray-800 text-left hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors disabled:cursor-not-allowed"
      [class.opacity-50]="exporting() !== null && exporting() !== option.format">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg" [class]="option.tint">
        @if (exporting() === option.format) {
        <span class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
        } @else {
        <lucide-icon [img]="option.icon" [size]="20" aria-hidden="true"></lucide-icon>
        }
      </span>
      <span class="flex-1 min-w-0">
        <span class="block text-sm font-bold text-gray-900 dark:text-gray-100">{{ option.label }}</span>
        <span class="block text-[11px] text-gray-500 dark:text-gray-400">
          {{ exporting() === option.format ? 'Preparing the file...' : option.description }}
        </span>
      </span>
    </button>
    }
  </div>
</app-modal>
