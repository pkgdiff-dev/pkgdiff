# WebSocket Connection Upgrade Mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# TLS termination and domain redirects are handled by the host nginx.
# This container serves the built files, hands pages to the render server (compose service "ssr",
# the same image run with Node) and proxies the API and the hub, all over plain HTTP.
server {
    listen 80;
    server_name _;

    root /app/browser;
    charset utf-8;
    server_tokens off;
    # The largest request is a blog post saved from the admin panel
    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;

    # Client IP: trust X-Forwarded-For only when the peer is inside the compose
    # subnet (the host nginx reaches us via docker-proxy on 172.28.0.1, the render
    # server calls the API from inside it). The rightmost untrusted address becomes
    # $remote_addr, which is then forwarded as the single X-Forwarded-For value
    # (overwrite, never append).
    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's DNS, asked when a page is requested instead of when nginx starts: nginx comes up and
    # keeps serving the application even while the render server is missing or restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # A file of the build is served from disk; everything else is a page
    location / {
        try_files $uri @ssr;
    }

    # Pages are rendered on the server. No X-Forwarded-Host/-Proto is passed on: the render server
    # needs the visitor's address and nothing else, and it resolves the API inside this network.
    location @ssr {
        set $ssr_upstream http://ssr:4000;
        proxy_pass $ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;

        # Without the render server the visitor still gets the application: the client-side shell,
        # which renders the same page in the browser
        error_page 502 503 504 = /index.csr.html;

        # A page names the files of one build; a stored copy would ask for files of an older one
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.csr.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Dynamic sitemap, generated by the backend
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/sitemap;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # API Proxy
    # ^~ keeps an API address that ends like a file (a package named chart.js) away from the
    # static-asset regex below. No URI part on proxy_pass: the request URI then goes on as the browser
    # sent it. With one, nginx sends the decoded URI, and the %2F of a scoped npm name
    # (/api/Package/npm/%40apollo%2Fserver) becomes a slash the API has no route for.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # SignalR Hub
    location ^~ /analysisHub {
        proxy_pass http://backend:8080/analysisHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hangfire dashboard (same-origin). ^~ stops the static-asset regex below
    # from capturing the dashboard's .js/.css requests; no URI part on
    # proxy_pass so the full /hangfire path reaches the backend.
    location ^~ /hangfire {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Files of the build carry a hash of their content in their name: a changed file is a new
    # address, so a stored copy never goes stale.
    # In both blocks an address that only looks like a file (a package named chart.js) is a page;
    # it then gets the headers of a page, not these.
    location ~ "^/[^/]+-[A-Z0-9]{8}\.(?:js|css)$" {
        try_files $uri @ssr;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other file keeps its name when it changes (icons, share images, the logo fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        try_files $uri @ssr;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }
}
